name: Trigger auto deployment for tvisaabackendv2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TVISAABACKENDV2_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TVISAABACKENDV2_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TVISAABACKENDV2_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: tvisaacontainers-dnhfhybsbjb3cwef.azurecr.io
          username: ${{ secrets.TVISAAFORYOUBACKEND_REGISTRY_USERNAME }}
          password: ${{ secrets.TVISAAFORYOUBACKEND_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: tvisaacontainers-dnhfhybsbjb3cwef.azurecr.io/tvisaa-backend:${{ github.sha }}

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: tvisaabackendv2
          resourceGroup: Tvisaa_for_you
          imageToDeploy: tvisaacontainers-dnhfhybsbjb3cwef.azurecr.io/tvisaa-backend:${{ github.sha }}
          acrName: tvisaacontainers-dnhfhybsbjb3cwef
          acrUsername: ${{ secrets.TVISAAFORYOUBACKEND_REGISTRY_USERNAME }}
          acrPassword: ${{ secrets.TVISAAFORYOUBACKEND_REGISTRY_PASSWORD }}
